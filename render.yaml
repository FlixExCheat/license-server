# Render blueprint: one web service + one Postgres, wired together.
#
# Import the repo on render.com, Render reads this file, asks for the two
# secrets marked sync:false, and deploys.

services:
  - type: web
    name: straw-license
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: straw-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: LICENSE_PRIVATE_KEY
        sync: false          # paste the PEM from scripts/genkey.js
      - key: BOOTSTRAP_USER
        sync: false          # first owner account, e.g. admin
      - key: BOOTSTRAP_PASS
        sync: false          # first owner password, pick something long

databases:
  - name: straw-db
    databaseName: straw
    user: straw
    plan: free
    region: frankfurt
